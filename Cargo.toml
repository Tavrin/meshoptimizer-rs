[package]
name = "meshoptimizer-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Pure safe Rust port of meshoptimizer 1.3 with byte-identical output. Covers mesh simplification, meshlets, cluster LOD, vertex/index compression and optional parallel batch APIs."
authors = ["meshoptimizer-rs contributors"]
license = "MIT"
repository = "https://github.com/Tavrin/meshoptimizer-rs"
documentation = "https://docs.rs/meshoptimizer-rs"
readme = "README.md"
keywords = ["mesh", "meshoptimizer", "simplification", "meshlet", "gltf"]
categories = ["graphics", "rendering", "game-development", "compression", "no-std"]
include = ["/src/**/*.rs", "/tests/api.rs", "/tests/meshlets.rs", "/tests/preprocessing.rs", "/tests/parallel.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE", "/UPSTREAM.md"]

[features]
default = ["std"]
std = []
experimental = []
clusterlod = []
parallel = ["std", "dep:rayon"]

[dependencies]
libm = { version = "=0.2.16", default-features = false }
rayon = { version = "=1.11.0", optional = true }

[package.metadata.docs.rs]
all-features = true

[profile.release]
codegen-units = 1
lto = "fat"

# Differential fuzz targets for the changed families of the 0.2.16 train
# (remap, simplify incl. simplify_with_update, meshlets incl. spatial/bounds, cluster LOD).
# Copied from the 0.2.15 harness (parity/0215-qualify/fuzz) with the baseline
# moved to v0.2.15. Build from a copy placed next to `base/` (v0.2.15 with the
# package renamed meshoptimizer-baseline) and `candidate/` (the train tree):
#   cargo +nightly fuzz build --fuzz-dir <copy> -O -a --sanitizer none
# parity/0216-fuzz/fuzz.py does this and runs each target under the release rule.
[package]
name = "meshopt-qualify-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
candidate = { package = "meshoptimizer-rs", path = "../candidate", default-features = false, features = ["std", "simd", "clusterlod", "experimental"] }
baseline = { package = "meshoptimizer-baseline", path = "../base", default-features = false, features = ["std", "simd", "clusterlod", "experimental"] }

[lib]
path = "src.rs"

[workspace]
members = ["."]

[[bin]]
name = "simplify"
path = "fuzz_targets/simplify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "simplify_extra"
path = "fuzz_targets/simplify_extra.rs"
test = false
doc = false
bench = false

[[bin]]
name = "meshlets"
path = "fuzz_targets/meshlets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clod"
path = "fuzz_targets/clod.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remap"
path = "fuzz_targets/remap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bounds_diff"
path = "fuzz_targets/bounds_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lod_chain"
path = "fuzz_targets/lod_chain.rs"
test = false
doc = false
bench = false

[package]
name = "meshopt-cluster-lod-parity"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
meshoptimizer-rs = { path = "../..", default-features = false, features = ["clusterlod"] }

[[bin]]
name = "cluster-lod-rust"
path = "main.rs"

[profile.consumer]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "thin"

[[bin]]
name = "cluster-lod-dag-oracle"
path = "dag_oracle.rs"

[[bin]]
name = "cluster-lod-cluster-c"
path = "cluster_c/main.rs"

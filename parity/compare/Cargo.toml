[package]
name = "meshopt-crate-comparison"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
ours = ["dep:meshoptimizer-rs"]
theirs = ["dep:meshopt"]
peer7 = ["dep:meshopt7"]
optimesh = ["dep:optimesh"]
peer-simd = ["meshoptimizer-rs?/simd", "optimesh?/simd"]
full = ["meshoptimizer-rs?/experimental", "meshoptimizer-rs?/clusterlod", "meshoptimizer-rs?/parallel"]

[dependencies]
meshoptimizer-rs = { path = "../..", optional = true, default-features = false, features = ["std"] }
meshopt = { version = "=0.6.2", optional = true }
meshopt7 = { package = "meshopt", version = "=0.7.0", optional = true }
optimesh = { version = "=1.1.0", optional = true }

[[bin]]
name = "cmp-driver"
path = "src/main.rs"
[[bin]]
name = "cmp-decode"
path = "src/decode.rs"
[[bin]]
name = "cmp-full"
path = "src/full.rs"
[[bin]]
name = "cmp-empty"
path = "src/empty.rs"

[profile.moss]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.defaults]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
strip = "symbols"

[lib]
name = "peer_decode"
path = "src/peer_wasm.rs"
crate-type = ["cdylib"]

[[bin]]
name = "peer-stream-ref"
path = "src/peer_stream_ref.rs"
required-features = ["peer7"]

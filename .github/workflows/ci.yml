name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo build --locked --no-default-features

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --locked --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --target wasm32-unknown-unknown --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features

  parity:
    runs-on: ubuntu-latest
    env:
      MESHOPT_REFERENCE: ${{ github.workspace }}/reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zeux/meshoptimizer
          ref: 4c203430ca565cb59a468a91922c76c208169536
          path: reference
      - run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/meshopt-parity" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo fetch --locked --manifest-path parity/Cargo.toml
      - run: parity/check-reference.sh
      - run: parity/run.sh --phase 0.1
      - run: parity/sweep.sh --cases-per-family 1000 --seed 20261002
      - run: parity/js.sh --require-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-lane1
          path: parity/results/
      - name: Remove temporary build output
        if: always()
        shell: bash
        run: rm -rf -- "$CARGO_TARGET_DIR"

path = "fuzz_targets/bake.rs"
test = false
doc = false
bench = false
[[bin]]
name = "reconstruct"
path = "fuzz_targets/reconstruct.rs"
test = false
doc = false
bench = false
[[bin]]
name = "layout"
path = "fuzz_targets/layout.rs"
test = false
doc = false
bench = false

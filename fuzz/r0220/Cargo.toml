[package]
name = "meshopt-r0220-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
[package.metadata]
cargo-fuzz = true
[dependencies]
libfuzzer-sys = "=0.4.13"
meshoptimizer-rs = { path = "../..", features = ["clusterlod", "parallel"] }
rayon = "=1.11.0"
[workspace]
members = ["."]
[[bin]]
name = "dag_format_v2"
path = "fuzz_targets/dag_format_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attr_page"
path = "fuzz_targets/attr_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v2_build"
path = "fuzz_targets/v2_build.rs"
test = false
doc = false
bench = false
